name: Keep Render service awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: curl -sf --max-time 90 --retry 2 --retry-delay 10 "https://loan-approval-prediction-1a7a.onrender.com/" > /dev/null
